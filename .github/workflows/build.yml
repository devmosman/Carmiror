name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build both apps
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-APKs
          path: |
            phone/build/outputs/apk/debug/phone-debug.apk
            car/build/outputs/apk/debug/car-debug.apk
          if-no-files-found: error

      # Rolling "latest" release so the APKs can be downloaded straight from a phone browser.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp phone/build/outputs/apk/debug/phone-debug.apk CarMirror-Phone.apk
          cp car/build/outputs/apk/debug/car-debug.apk CarMirror-Car.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CarMirror-Phone.apk CarMirror-Car.apk \
            --title "Latest build" \
            --notes "Built from commit $GITHUB_SHA" \
            --target "$GITHUB_SHA"
